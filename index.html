<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>儿康堂门诊个人接诊患者统计情况</title>
  <style>
    body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    .box{max-width:420px;margin:12vh auto;background:#fff;border:1px solid #e5e7ef;border-radius:16px;padding:26px 24px}
    h1{font-size:22px;margin:0 0 10px}p{color:#667085;line-height:1.6}input{width:100%;box-sizing:border-box;border:1px solid #cfd6e4;border-radius:10px;padding:12px;margin:10px 0;font-size:16px}button{width:100%;border:0;border-radius:10px;background:#1f6feb;color:#fff;padding:12px;font-size:16px;cursor:pointer}.err{color:#b42318;font-size:14px;min-height:22px;margin-top:10px}.loading{padding:24px}
  </style>
</head>
<body>
  <div id="gate" class="box">
    <h1>儿康堂门诊个人接诊患者统计情况</h1>
    <p>请输入访问密码后查看数据面板。</p>
    <input id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
    <button id="btn">进入面板</button>
    <div id="err" class="err"></div>
  </div>
  <script>
    const PASSWORD_HASH = '5e8ee8f19580f50c6d00b873007dbc5b5f6d18fffded71b2eb614ba586213956';
    const PARTS = ['part-00.js','part-01.js','part-02.js','part-03.js','part-04.js','part-05.js','part-06.js','part-07.js','part-08.js','part-09.js'];
    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }
    async function loadDashboard() {
      document.body.innerHTML = '<p class="loading">正在加载儿康堂门诊个人接诊患者统计情况...</p>';
      window.__HTML_PARTS = [];
      for (const part of PARTS) await loadScript(part);
      const html = (window.__HTML_PARTS || []).join('');
      document.open();
      document.write(html);
      document.close();
    }
    async function verify() {
      const input = document.getElementById('pwd').value.trim();
      const err = document.getElementById('err');
      if (!input) { err.textContent = '请输入密码'; return; }
      if (await sha256(input) === PASSWORD_HASH) {
        sessionStorage.setItem('ekt_dashboard_ok', '1');
        loadDashboard();
      } else {
        err.textContent = '密码错误，请重新输入';
      }
    }
    document.getElementById('btn').addEventListener('click', verify);
    document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
    if (sessionStorage.getItem('ekt_dashboard_ok') === '1') loadDashboard();
  </script>
</body>
</html>
